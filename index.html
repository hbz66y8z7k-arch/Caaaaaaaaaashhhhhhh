<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الفئات النقدية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* منع الزوم في الموبايل وتوسيط النصوص والأرقام داخل الخانات تماماً */
        input.calc-input, input[type="number"] {
            font-size: 16px !important;
            text-align: center !important;
        }

        /* تأثير الاسم الساطع */
        .neon-glow {
            background: linear-gradient(90deg, #ff4d4d, #ff8080, #ffffff, #ff8080, #ff4d4d);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 2s linear infinite;
            text-shadow: 0 0 12px rgba(255, 77, 77, 0.5);
            font-weight: 900;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-4 px-2">

    <div id="captureArea" class="max-w-md mx-auto bg-slate-950 p-1 rounded-xl">
        <!-- اسم صاحب التطبيق المضبوط -->
        <div class="text-center mb-5 mt-2">
            <h2 class="text-lg tracking-wider neon-glow uppercase">Muuhaameed hannii</h2>
        </div>

        <header class="text-center mb-4">
            <h1 class="text-xl font-bold text-red-500">حاسبة الفئات النقدية</h1>
            <p class="text-slate-400 text-xs">أدخل الورق فراكشن، البواكي، والرزم للحساب الفوري</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg mb-3">
            <div class="flex justify-between items-center mb-3 text-xs bg-slate-950 p-2.5 rounded-lg border border-slate-800 gap-2">
                <div class="flex items-center gap-1">📌 باكو: <input type="number" id="bundleSize" value="100" class="bg-slate-900 text-red-400 font-bold px-1.5 py-1 rounded w-14 text-center border border-slate-700" oninput="calculateAll()"></div>
                <div class="flex items-center gap-1">📌 رزمة: <input type="number" id="packSize" value="500" class="bg-slate-900 text-red-400 font-bold px-1.5 py-1 rounded w-14 text-center border border-slate-700" oninput="calculateAll()"></div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="py-2 px-1 text-center">الفئة</th>
                            <th class="py-2 px-1 text-center">فراكشن</th>
                            <th class="py-2 px-1 text-center">بواكي</th>
                            <th class="py-2 px-1 text-center">رزم</th>
                            <th class="py-2 px-1 text-center">عدد الورق</th>
                            <th class="py-2 px-1 text-center">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- فئة 200 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">200</td>
                            <td class="py-2 px-1"><input type="number" id="friction-200" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-200" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-200" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-200">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-200">0</td>
                        </tr>
                        <!-- فئة 100 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">100</td>
                            <td class="py-2 px-1"><input type="number" id="friction-100" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-100" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-100" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-100">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-100">0</td>
                        </tr>
                        <!-- فئة 50 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">50</td>
                            <td class="py-2 px-1"><input type="number" id="friction-50" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-50" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-50" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-50">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-50">0</td>
                        </tr>
                        <!-- فئة 20 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">20</td>
                            <td class="py-2 px-1"><input type="number" id="friction-20" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-20" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-20" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-20">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-20">0</td>
                        </tr>
                        <!-- فئة 10 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">10</td>
                            <td class="py-2 px-1"><input type="number" id="friction-10" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-10" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-10" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-10">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-10">0</td>
                        </tr>
                        <!-- فئة 5 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2 px-1 font-bold text-red-500 text-sm text-center">5</td>
                            <td class="py-2 px-1"><input type="number" id="friction-5" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="bundle-5" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1"><input type="number" id="pack-5" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-red-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2 px-1 text-slate-300 text-center text-[11px]" id="sheets-5">0</td>
                            <td class="py-2 px-1 font-bold text-slate-200 text-[11px] text-center" id="total-5">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-gradient-to-r from-red-700 to-rose-900 rounded-xl p-3.5 shadow-xl flex flex-col gap-2.5">
            <div>
                <span class="text-red-100 text-[11px] block">الإجمالي الكلي:</span>
                <h2 id="grandTotal" class="text-2xl font-black text-white tracking-wider">0 ج.م</h2>
            </div>
            <div class="flex gap-2">
                <button onclick="resetForm()" class="flex-1 bg-black/20 text-white font-semibold py-2 rounded-lg text-xs border border-white/10 active:scale-95 transition">تصفير 🔄</button>
                <button onclick="shareScreenshot()" id="shareBtn" class="flex-1 bg-white text-red-950 font-bold py-2 rounded-lg text-xs shadow active:scale-95 transition">مشاركة 📤</button>
            </div>
        </div>
    </div>

    <script>
        const denominations = [200, 100, 50, 20, 10, 5];

        function calculateAll() {
            const bundleSize = parseInt(document.getElementById('bundleSize').value) || 100;
            const packSize = parseInt(document.getElementById('packSize').value) || 500;
            let grandTotal = 0;

            denominations.forEach(denom => {
                const frictionVal = parseFloat(document.getElementById(`friction-${denom}`).value) || 0;
                const bundleVal = parseFloat(document.getElementById(`bundle-${denom}`).value) || 0;
                const packVal = parseFloat(document.getElementById(`pack-${denom}`).value) || 0;

                const totalSheets = frictionVal + (bundleVal * bundleSize) + (packVal * packSize);
                const totalAmount = totalSheets * denom;
                grandTotal += totalAmount;

                document.getElementById(`sheets-${denom}`).innerText = totalSheets.toLocaleString();
                document.getElementById(`total-${denom}`).innerText = totalAmount.toLocaleString();
            });

            document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + ' ج.م';
        }

        function resetForm() {
            document.querySelectorAll('.calc-input').forEach(input => input.value = '');
            calculateAll();
        }

        // دالة التقاط الصورة والمشاركة الفورية
        function shareScreenshot() {
            const btn = document.getElementById('shareBtn');
            btn.innerText = "جاري التقاط الصورة...";
            
            const element = document.getElementById('captureArea');
            html2canvas(element, {
                scale: 2,
                backgroundColor: '#020617',
                useCORS: true
            }).then(canvas => {
                canvas.toBlob(blob => {
                    const file = new File([blob], "cash-calculation.png", { type: "image/png" });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'حاسبة الفئات النقدية',
                            text: 'تقرير الفئات النقدية والإجمالي الكلي'
                        }).catch(() => {});
                    } else {
                        const link = document.createElement('a');
                        link.download = 'cash-calculation.png';
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }
                    btn.innerText = "مشاركة 📤";
                });
            }).catch(() => {
                btn.innerText = "مشاركة 📤";
                alert("حدث خطأ أثناء التقاط الصورة");
            });
        }

        // الانتقال للخانة التالية عند الضغط على Enter من الكيبورد
        const inputs = document.querySelectorAll('.next-field');
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const nextInput = inputs[index + 1];
                    if (nextInput) {
                        nextInput.focus();
                        nextInput.select();
                    } else {
                        input.blur();
                    }
                }
            });
        });
    </script>
</body>
</html>
