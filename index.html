<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الفئات النقدية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* تأثير الإضاءة المتحركة للاسم */
        .neon-glow {
            background: linear-gradient(90deg, #34d399, #6ee7b7, #ffffff, #6ee7b7, #34d399);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-4 px-2">

    <div class="max-w-md mx-auto">
        <!-- اسم صاحب التطبيق مع الإضاءة المتحركة -->
        <div class="text-center mb-3">
            <h2 class="text-lg font-black tracking-wider neon-glow uppercase">Muuhaameed hannii</h2>
        </div>

        <header class="text-center mb-4">
            <h1 class="text-xl font-bold text-emerald-400">حاسبة الفئات النقدية</h1>
            <p class="text-slate-400 text-xs">أدخل الورق المفرد، البواكي، والرزم للحساب الفوري</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg mb-3">
            <div class="grid grid-cols-2 gap-2 mb-3 text-xs bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                <div>📌 باكو: <input type="number" id="bundleSize" value="100" class="bg-slate-900 text-emerald-400 font-bold px-1 py-0.5 rounded w-12 text-center border border-slate-700 inline-block" oninput="calculateAll()"></div>
                <div>📌 رزمة: <input type="number" id="packSize" value="1000" class="bg-slate-900 text-emerald-400 font-bold px-1 py-0.5 rounded w-12 text-center border border-slate-700 inline-block" oninput="calculateAll()"></div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="py-2 px-1">الفئة</th>
                            <th class="py-2 px-1">مفرد</th>
                            <th class="py-2 px-1">بواكي</th>
                            <th class="py-2 px-1">رزم</th>
                            <th class="py-2 px-1">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- فئة 200 -->
                        <tr class="border-b border-slate-800/60">
                            <td class="py-2.5 px-1 font-bold text-emerald-400 text-sm">200</td>
                            <td class="py-2.5 px-1"><input type="number" id="friction-200" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center text-xs focus:border-emerald-500 focus:outline-none" oninput="calculateAll()"></td>
                            <td class="py-2.5 px-1"><input type="number" id="bundle-200" placeholder="0" class="calc-input next-field w-full bg-slate-950 border border-slate-800 rounded px-1 py-1.5 text-white text-center
